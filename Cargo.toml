[package]
name = "hoot-polars"
version = "0.1.0"
edition = "2024"
default-run = "hoot-polars"
description = "Native CTRE Phoenix 6 HOOT decoder with Polars output"
license = "MIT OR Apache-2.0"
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "docs/**",
    "AGENTS.md",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "THIRD_PARTY_NOTICES.md",
]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
memmap2 = "0.9"
polars = { version = "0.51.0", features = ["parquet"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.20"

[dev-dependencies]
proptest = "1.7"
